services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: sidhivinayaksoftwork, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sidhivinayaksoftwork
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: local-development-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on: [db]
volumes: { postgres_data: {} }

